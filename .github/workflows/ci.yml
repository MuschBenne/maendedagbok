# CI: körs på GitHub vid varje PR och varje push till main.
#
# Installerar beroenden och kör samma kontroller som lokalt: lint, typer, tester
# och ett produktionsbygge. Misslyckas något steg blir PR:en röd.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
